# Place this file at /etc/nginx/sites-available/tunnel on your VPS.
#
# Activation steps:
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo ln -s /etc/nginx/sites-available/tunnel /etc/nginx/sites-enabled/tunnel
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Replace "yourdomain.com" with your actual domain throughout this file.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

limit_req_zone $binary_remote_addr zone=control:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=public:10m  rate=120r/m;

# Catch-all: drop requests to the raw VPS IP address
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    return 444;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name yourdomain.com *.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Control port — WebSocket connections from the tunnel client
    location /tunnel-control {
        limit_req zone=control burst=5;

        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Public traffic — incoming requests from the internet
    location / {
        limit_req zone=public burst=20 nodelay;

        client_max_body_size 11m;

        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
