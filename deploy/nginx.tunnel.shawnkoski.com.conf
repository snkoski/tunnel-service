# nginx site config for tunnel.shawnkoski.com
# Place as /etc/nginx/sites-available/tunnel and symlink into sites-enabled.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

limit_req_zone $binary_remote_addr zone=control:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=public:10m rate=120r/m;

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/tunnel.shawnkoski.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.shawnkoski.com/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name tunnel.shawnkoski.com *.tunnel.shawnkoski.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.tunnel.shawnkoski.com;

    ssl_certificate /etc/letsencrypt/live/tunnel.shawnkoski.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.shawnkoski.com/privkey.pem;

    location /tunnel-control {
        limit_req zone=control burst=5;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=public burst=20 nodelay;
        client_max_body_size 11m;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
